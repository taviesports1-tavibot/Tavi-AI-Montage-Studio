name: Temporary Import MoneyPrinterTurbo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-import-moneyprinter.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-moneyprinter-turbo
          fetch-depth: 0

      - name: Clone pinned MoneyPrinterTurbo source
        run: |
          rm -rf upstream-moneyprinter MoneyPrinterTurbo
          git clone https://github.com/harry0703/MoneyPrinterTurbo.git upstream-moneyprinter
          cd upstream-moneyprinter
          git checkout e14dea5578bb2154480b6bc436009eaa9987f0e3
          rm -rf .git
          cd ..
          mkdir -p MoneyPrinterTurbo
          cp -a upstream-moneyprinter/. MoneyPrinterTurbo/
          rm -rf upstream-moneyprinter

      - name: Commit imported source to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MoneyPrinterTurbo
          if git diff --cached --quiet; then
            echo "No import changes."
            exit 0
          fi
          git commit -m "Import MoneyPrinterTurbo source"
          git push origin HEAD:agent/import-moneyprinter-turbo
