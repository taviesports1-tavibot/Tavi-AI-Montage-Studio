name: Verify Production Worker

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-worker.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check worker health
        run: |
          set -euxo pipefail
          curl --fail --show-error --silent --max-time 20 \
            https://tavi-ai-montage-studio-production.up.railway.app/health

      - name: Check production CORS preflight
        run: |
          set -euxo pipefail
          headers=$(mktemp)
          curl --fail --show-error --silent --max-time 20 \
            -X OPTIONS \
            -H 'Origin: https://tavi-ai-montage-studio.vercel.app' \
            -H 'Access-Control-Request-Method: POST' \
            -D "$headers" \
            -o /dev/null \
            https://tavi-ai-montage-studio-production.up.railway.app/api/projects
          cat "$headers"
          grep -qi '^access-control-allow-origin: https://tavi-ai-montage-studio.vercel.app' "$headers"
